syntax = "proto3";
package warzonecore.warzone.v1;

option go_package = "github.com/Davi-UEFS/Warzone/warzone-core/x/warzone/types";

// Drone defines the Drone message.
message Drone {
  string drone_id = 1;    // ID do drone.
  string status = 2;      // Status (livre ou ocupado).
  string sector = 3;      // Setor atual.
  string battery = 4;     // Nível de bateria (aqui fica em string mesmo).
  string creator = 5;     // Criador do bloco.
  uint64 currentMissionId = 6;    // Missão atual.
}
