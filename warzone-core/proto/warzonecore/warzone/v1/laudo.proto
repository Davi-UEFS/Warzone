syntax = "proto3";
package warzonecore.warzone.v1;

option go_package = "github.com/Davi-UEFS/Warzone/warzone-core/x/warzone/types";

// Laudo defines the Laudo message.
message Laudo {
  string requisition_id = 1;    // ID da requisição
  string drone_id = 2;          // ID do drone que realizou a missão
  string relatorio = 3;         // Relatório que o drone forneceu.
  string status = 4;            // Status do laudo.
  string creator = 5;           // Criador do bloco.
}
